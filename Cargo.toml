[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/golgor/fw16-macropad"
rust-version = "1.85"
publish = false

[workspace.dependencies]
macropad-proto = { path = "crates/macropad-proto" }
macropad-hid = { path = "crates/macropad-hid" }
macropad-input = { path = "crates/macropad-input" }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
